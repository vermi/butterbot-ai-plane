name: CI

on:
  push:
  pull_request:

jobs:
  plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plane
    steps:
      - uses: actions/checkout@v4
      # btleplug talks to BlueZ over D-Bus; flite makes the robot's voice (the tests speak).
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config flite
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plane
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  plane-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plane
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Keep in sync with rust-version in plane/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plane
      - run: cargo check --locked --all-targets

  firmware-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-rs
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The esp toolchain, ldproxy, and the ESP-IDF esp-idf-sys downloads (into .embuild).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.rustup/toolchains/esp
            firmware-rs/.embuild
            firmware-rs/target
          key: firmware-rs-${{ runner.os }}-${{ hashFiles('firmware-rs/Cargo.lock', 'firmware-rs/sdkconfig.defaults', 'firmware-rs/rust-toolchain.toml') }}
          restore-keys: firmware-rs-${{ runner.os }}-
      - name: Esp Rust toolchain
        run: |
          command -v espup || cargo install espup --locked
          command -v ldproxy || cargo install ldproxy --locked
          espup install --std -t esp32s3 -f "$HOME/export-esp.sh"
      - run: cargo +stable fmt --check
      - name: Build
        run: |
          . "$HOME/export-esp.sh"
          cargo build --release --locked
