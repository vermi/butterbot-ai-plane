[package]
name = "bbplane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ButterBot AI control plane: robot link, live view and MCP server"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bbproto = { version = "0.1.0", path = "../bbproto", features = ["schemars"] }
btleplug = "0.13.4"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures = "0.3.34"
hound = "3.5.1"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
local-ip-address = "0.6.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tract-onnx = "0.23.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
uuid = "1.27.0"
whisper-rs = { version = "0.16.0", optional = true, features = ["tracing_backend"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full", "test-util"] }

# Speech-to-text runs on the GPU on Macs.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal", "tracing_backend"] }

[features]
default = ["stt"]
# Speech-to-text for `listen` and `hear` (builds whisper.cpp; needs cmake and a C++ compiler).
stt = ["dep:whisper-rs"]
