[package]
name = "bbplane"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ButterBot AI control plane: robot link, live view and MCP server"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bbproto = { version = "0.1.0", path = "../bbproto", features = ["schemars"] }
btleplug = "0.13.4"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures = "0.3.34"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
local-ip-address = "0.6.13"
rmcp = { version = "3.5.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.27.0"
