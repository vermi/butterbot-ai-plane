[package]
name = "butterbot-ai"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "AI-only ButterBot firmware: the robot's side of the bbplane link"
publish = false

[[bin]]
name = "butterbot-ai"
harness = false # no unit test harness on the target

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
# Debug builds are far too large and slow for the robot; build release.
opt-level = "s"
debug = true

[dependencies]
bbproto = { path = "../plane/crates/bbproto" }
esp-idf-svc = { version = "0.53", default-features = false, features = ["std", "binstart", "alloc", "native"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.3"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

